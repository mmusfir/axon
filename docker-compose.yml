services:
  api-gateway:
    build:
      context: ./backend/api-gateway
      target: development
    command: npm run start:dev
    environment:
      - PORT=5001
    ports:
      - "${API_GATEWAY_PORT}:5001"

  ai-worker:
    build:
      context: ./backend/ai-worker
      target: development
    command: npm run start:dev
    environment:
      - PORT=5002
    ports:
      - "${AI_WORKER_PORT}:5002"

  billing:
    build:
      context: ./backend/billing
      target: development
    command: npm run start:dev
    environment:
      - PORT=5003
    ports:
      - "${BILLING_PORT}:5003"
